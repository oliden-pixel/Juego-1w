<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d0d18">
<title>Merlot Chileno</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Juego para celular sobre el redescubrimiento del Carménère en Chile: de la investigación en el viñedo a la botella etiquetada.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Gloock&display=swap">
<style>
/* Layout: un solo escenario vertical a pantalla completa; el valle animado va de fondo
   y las pantallas (portada, ruta, fichas) flotan encima como paneles opacos color vino. */
:root {
  color-scheme: dark;
  --ink: #1d0d18;        /* fondo general, casi negro con tinte de ciruela */
  --panel: #2b1423;      /* paneles */
  --panel-2: #3b1c30;    /* superficies elevadas */
  --line: #5a3349;       /* bordes finos */
  --paper: #f4eadf;      /* texto principal */
  --muted: #c3aab6;      /* texto secundario */
  --carmin: #cf2f4a;     /* acento: el carmín que da nombre a la cepa */
  --carmin-ink: #ffffff;
  --gold: #e6b450;       /* estrellas y logros */
  --vine: #7fbf5a;       /* estados correctos */
  --display: "Gloock", "Georgia", "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
  height: 100%;
}
html { height: 100%; }
body {
  margin: 0; height: 100%;
  background: var(--ink); color: var(--paper);
  font-family: var(--body); font-size: 16px; line-height: 1.45;
  overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

#app {
  position: relative; height: 100%; max-width: 520px; margin: 0 auto;
  overflow: hidden; background: var(--ink);
  -webkit-user-select: none; user-select: none;
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---- HUD de partida ---- */
#hud {
  position: absolute; inset: 0 0 auto 0; z-index: 3;
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--ink), rgba(29, 13, 24, .82));
  border-bottom: 1px solid var(--line);
}
#hud .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
#hudTitle { font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--gold); border-radius: 4px; transform-origin: left center; }
#hudScore { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; min-width: 68px; text-align: right; }

/* ---- Controles de partida ---- */
#controls {
  position: absolute; inset: auto 0 0 0; z-index: 3;
  display: flex; gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#controls .btn { flex: 1; min-height: 60px; font-size: 18px; touch-action: none; }

/* ---- Botones ---- */
.btn {
  appearance: none; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel-2); color: var(--paper);
  font: 700 16px/1.1 var(--body); padding: 14px 18px; min-height: 50px;
  cursor: pointer; touch-action: manipulation;
}
.btn:active, .btn.held { transform: translateY(1px); filter: brightness(1.2); }
.btn:focus-visible, .stop:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn.primary { background: var(--carmin); border-color: var(--carmin); color: var(--carmin-ink); }
.btn.small { min-height: 38px; padding: 8px 12px; font-size: 13px; }
.btn.ghost { background: transparent; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 130px; }

/* ---- Pantallas ---- */
#screen {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(rgba(29, 13, 24, 0) 0%, rgba(29, 13, 24, 0) 38%, rgba(29, 13, 24, .7) 56%, rgba(29, 13, 24, .94) 100%);
  overflow-y: auto;
}
#screen.full { justify-content: flex-start; background: rgba(29, 13, 24, .93); }
#screen.center { justify-content: center; background: rgba(29, 13, 24, .8); }
.panel {
  display: flex; flex-direction: column; gap: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; min-width: 0;
}
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 { font-size: clamp(46px, 15vw, 68px); letter-spacing: -.01em; }
h2 { font-size: 28px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* Portada: "Merlot" tachado en carmín es la tesis del juego */
.hero { display: flex; flex-direction: column; gap: 14px; padding: 4px 4px 0; }
.hero h1 span { display: block; }
.strike { position: relative; align-self: flex-start; width: max-content; }
.strike::after {
  content: ""; position: absolute; left: -4%; right: -4%; top: 56%; height: 6px;
  background: var(--carmin); border-radius: 3px; transform: rotate(-4deg);
  animation: strike .7s .35s cubic-bezier(.2, .8, .2, 1) backwards;
}
@keyframes strike { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.hand { font-family: var(--display); font-style: italic; color: var(--carmin); font-size: 26px; margin-top: -6px; transform: rotate(-3deg); transform-origin: left; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
.hero p { max-width: 34ch; text-shadow: 0 1px 6px rgba(0, 0, 0, .7); }

/* Ruta de producción */
.route { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; list-style: none; }
.phase { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); padding: 14px 0 8px 52px; }
.stop {
  appearance: none; width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer;
  display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center;
  background: transparent; border: 0; border-top: 1px solid var(--line); padding: 12px 0;
}
.stop .num {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  font: 400 19px var(--display); border: 1px solid var(--line); background: var(--panel-2);
}
.stop.next .num { background: var(--carmin); border-color: var(--carmin); color: var(--carmin-ink); }
.stop .t { font-weight: 700; display: block; }
.stop .s { font-size: 13px; color: var(--muted); display: block; }
.stop[disabled] { opacity: .45; cursor: default; }
.stars { display: inline-flex; gap: 3px; }
.stars i {
  width: 16px; height: 16px; background: var(--line);
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.stars i.on { background: var(--gold); }
.stars.big i { width: 40px; height: 40px; }
.stars.big { gap: 8px; justify-content: center; }
.stars.big i.on { animation: pop .45s backwards; }
.stars.big i:nth-child(2).on { animation-delay: .18s; }
.stars.big i:nth-child(3).on { animation-delay: .36s; }
@keyframes pop { from { transform: scale(.2) rotate(-40deg); } 60% { transform: scale(1.25); } to { transform: none; } }

.how { border-top: 1px solid var(--line); padding-top: 12px; }
.how b, .fact b { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.fact { background: var(--panel-2); border-left: 3px solid var(--carmin); border-radius: 6px; padding: 12px 14px; font-size: 15px; }
.score-line { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 12px; }
.score-line strong { font-size: 30px; font-family: var(--display); font-weight: 400; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.field input, .field select {
  font: 600 16px var(--body); color: var(--paper); background: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 12px; width: 100%;
  -webkit-user-select: text; user-select: text;
}
.log { display: flex; flex-direction: column; gap: 10px; }
.log .fact.locked { border-left-color: var(--line); color: var(--muted); }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

#toast {
  position: absolute; left: 50%; top: 122px; z-index: 4; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--line); color: var(--paper);
  padding: 8px 14px; border-radius: 20px; font-weight: 700; font-size: 14px;
  max-width: calc(100% - 32px); text-align: center;
  opacity: 0; transition: opacity .25s; pointer-events: none;
}
#toast.on { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .strike::after, .stars.big i.on { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Escenario del juego"></canvas>
  <header id="hud" hidden>
    <button class="btn small" id="btnPause" type="button">Pausa</button>
    <div class="mid">
      <div id="hudTitle"></div>
      <div class="bar"><i id="hudBar"></i></div>
    </div>
    <div id="hudScore">0</div>
  </header>
  <div id="toast" role="status"></div>
  <div id="controls" hidden></div>
  <section id="screen"></section>
</div>

<script>
(() => {
'use strict';

/* ============================================================
   Utilidades
   ============================================================ */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgb = (c, al) => al == null ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${al})`;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function seeded(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const app = $('#app'), cv = $('#cv');
let ctx = cv.getContext('2d');
const elHud = $('#hud'), elHudTitle = $('#hudTitle'), elHudBar = $('#hudBar'), elHudScore = $('#hudScore');
const elScreen = $('#screen'), elControls = $('#controls'), elToast = $('#toast');
const FONT = '"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif';
const DISPLAY = '"Gloock", Georgia, serif';
const MS = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.25 : 1;
let W = 360, H = 640, DPR = 1;
const TOP = 66;   // alto reservado para el HUD
let BOT = 16;     // alto reservado para controles

/* ============================================================
   Guardado
   ============================================================ */
const KEY = 'merlot-chileno-v1';
const N_LEVELS = 8;
let save = { stars: Array(N_LEVELS).fill(0), best: Array(N_LEVELS).fill(0), sound: true, name: '', valley: 'Colchagua' };
function loadSave(extra) {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { d = null; }
  if (extra && extra.save) d = extra.save;
  if (d && Array.isArray(d.stars)) {
    for (let i = 0; i < N_LEVELS; i++) { save.stars[i] = clamp(d.stars[i] | 0, 0, 3); save.best[i] = (d.best && d.best[i]) | 0; }
    save.sound = d.sound !== false; save.name = typeof d.name === 'string' ? d.name.slice(0, 22) : ''; save.valley = d.valley || 'Colchagua';
  }
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* sin almacenamiento: la partida sigue en memoria */ } }
const unlocked = () => { let n = 0; while (n < N_LEVELS && save.stars[n] > 0) n++; return Math.min(n, N_LEVELS - 1); };
const totalStars = () => save.stars.reduce((a, b) => a + b, 0);

/* ============================================================
   Sonido (Web Audio, se activa con el primer toque)
   ============================================================ */
let AC = null;
function tone(f, d = .12, type = 'sine', v = .08, when = 0) {
  if (!save.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + when;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + .03);
  } catch (e) { /* audio no disponible */ }
}
const sfx = {
  ok() { tone(660, .09); tone(990, .13, 'sine', .07, .07); },
  bad() { tone(165, .22, 'sawtooth', .05); },
  tap() { tone(440, .05, 'triangle', .05); },
  drop() { tone(820, .06, 'sine', .04); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .08, i * .11)); }
};

/* ============================================================
   Primitivas de dibujo
   ============================================================ */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function txt(s, x, y, size, color, align = 'center', weight = 700, font = FONT) {
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function label(s, x, y, size = 12, fg = '#fff', bg = 'rgba(29,13,24,.78)') {
  ctx.font = `700 ${size}px ${FONT}`; const w = ctx.measureText(s).width + 14;
  x = clamp(x, w / 2 + 4, W - w / 2 - 4);
  ctx.fillStyle = bg; rr(x - w / 2, y - size * .85, w, size * 1.7, size * .85); ctx.fill();
  txt(s, x, y + .5, size, fg);
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function oval(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); }
function dot(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function poly(pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }

/* Capas estáticas: el paisaje y la bodega se dibujan una vez y se reutilizan en cada cuadro */
const layers = new Map();
function layer(key, fn) {
  let c = layers.get(key);
  if (!c) {
    if (layers.size >= 3) layers.delete(layers.keys().next().value);
    c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
    const prev = ctx; ctx = c.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    try { fn(); } finally { ctx = prev; }
    layers.set(key, c);
  }
  ctx.drawImage(c, 0, 0, W, H);
}

/* Hoja de vid: cinco lóbulos con nervaduras */
function leaf(x, y, r, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i <= 30; i++) {
    const a = i / 30 * TAU, q = r * (.56 + .44 * Math.pow(Math.abs(Math.cos(a * 2.5)), .55));
    const px = Math.sin(a) * q, py = -Math.cos(a) * q;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  if (r > 6) {
    ctx.strokeStyle = 'rgba(20,45,15,.3)'; ctx.lineWidth = Math.max(.6, r * .06); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,215,.26)'; ctx.lineWidth = Math.max(.6, r * .07);
    ctx.beginPath(); ctx.moveTo(0, r * .75); ctx.lineTo(0, -r * .7); ctx.moveTo(0, r * .25); ctx.lineTo(-r * .55, -r * .25); ctx.moveTo(0, r * .25); ctx.lineTo(r * .55, -r * .25); ctx.stroke();
  }
  ctx.restore();
}

/* Racimo: triángulo invertido de bayas con brillo */
const BUNCH_ROWS = [3, 4, 3, 2, 1];
function bunch(x, y, s, col, shine = 0, shrink = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#5c4a2a'; ctx.lineWidth = 2; ctx.lineCap = 'round'; line(0, -11, 0, -2);
  const r = 5.3 * (1 - shrink * .28), dark = rgb(mix(col, [0, 0, 0], .28)), base = rgb(col), lite = rgb(mix(col, [255, 255, 255], .22));
  BUNCH_ROWS.forEach((n, row) => {
    for (let i = 0; i < n; i++) {
      const bx = (i - (n - 1) / 2) * 9.4, by = row * 8.2;
      ctx.fillStyle = dark; dot(bx, by + .6, r + .5);
      ctx.fillStyle = (i + row) % 2 ? base : lite; dot(bx, by, r - .3);
      if (shine > 0) { ctx.fillStyle = `rgba(255,255,255,${.55 * shine})`; dot(bx - 1.7, by - 1.9, 1.5); }
    }
  });
  ctx.restore();
}

/* Parra vieja conducida en cabeza, con tronco retorcido */
const VINE_LEAVES = [[-27, -50, 13, -.5], [-13, -59, 14, -.2], [4, -61, 14, .15], [21, -55, 13, .5], [-19, -42, 11, -.8], [15, -42, 11, .7], [-3, -49, 12, 0], [-33, -40, 9, -1], [30, -41, 9, 1]];
function vine(x, y, s, t, o = {}) {
  const sw = Math.sin(t * 1.4 + (o.ph || 0)) * .07 * MS;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.lineCap = 'round';
  ctx.fillStyle = 'rgba(40,25,10,.22)'; oval(0, 2, 32, 6);
  if (o.stake) { ctx.fillStyle = '#9a7448'; ctx.fillRect(9, -72, 3.5, 74); ctx.fillStyle = '#7a5a36'; ctx.fillRect(11, -72, 1.5, 74); }
  ctx.fillStyle = '#5a3d27'; ctx.beginPath(); ctx.moveTo(-7, 1); ctx.quadraticCurveTo(-10, -15, -4, -25); ctx.quadraticCurveTo(-8, -34, -3, -42); ctx.lineTo(4, -42);
  ctx.quadraticCurveTo(8, -31, 4, -22); ctx.quadraticCurveTo(10, -10, 8, 1); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.2; line(-2, -3, -4, -17); line(3, -6, 4, -15); line(0, -24, -2, -37);
  ctx.strokeStyle = '#5a3d27'; ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.moveTo(-1, -40); ctx.quadraticCurveTo(-14, -37, -29, -45); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(1, -40); ctx.quadraticCurveTo(14, -37, 29, -45); ctx.stroke();
  const cs = o.leaves || ['#4f9a3a', '#3f8530', '#63ad48'];
  VINE_LEAVES.forEach((l, i) => leaf(l[0], l[1] + (o.droop ? 4 : 0), l[2], l[3] + sw * (i % 2 ? 1 : -1) + (o.droop ? .45 * Math.sign(l[0] || 1) : 0), cs[i % 3]));
  if (o.tip) {
    [[-22, -67], [0, -75], [20, -69]].forEach((p, i) => {
      ctx.strokeStyle = '#5d8a3a'; ctx.lineWidth = 1.5; line(p[0] * .8, p[1] + 12, p[0] + sw * 18, p[1]);
      leaf(p[0] + sw * 18, p[1], 7.5, sw * 3 + (i - 1) * .4, o.tip);
      leaf(p[0] + 6 + sw * 18, p[1] + 6, 5.5, .7 + sw * 3, o.tip);
    });
  }
  ctx.restore();
}

/* Canasto de mimbre */
function basket(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(40,25,10,.25)'; oval(0, 25, 44, 6);
  ctx.strokeStyle = '#7a5526'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(0, -16, 30, 22, 0, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = '#b3873f'; poly([[-44, -16], [44, -16], [34, 24], [-34, 24]]);

/* Botella bordelesa */
function bottlePath(x, yb, h) {
  const w = h * .27, nw = w * .36, body = h * .6, sh = h * .76;
  ctx.beginPath();
  ctx.moveTo(x - w / 2, yb - 4); ctx.quadraticCurveTo(x - w / 2, yb, x - w / 2 + 4, yb); ctx.lineTo(x + w / 2 - 4, yb); ctx.quadraticCurveTo(x + w / 2, yb, x + w / 2, yb - 4);
  ctx.lineTo(x + w / 2, yb - body); ctx.bezierCurveTo(x + w / 2, yb - sh + 2, x + nw / 2, yb - sh + 6, x + nw / 2, yb - sh - 6);
  ctx.lineTo(x + nw / 2, yb - h); ctx.lineTo(x - nw / 2, yb - h); ctx.lineTo(x - nw / 2, yb - sh - 6);
  ctx.bezierCurveTo(x - nw / 2, yb - sh + 6, x - w / 2, yb - sh + 2, x - w / 2, yb - body); ctx.closePath();
}

  ctx.restore();

    ctx.strokeStyle = '#e6b450'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);

      let lines = [o.text[0]];
      if (o.text[0].length > 11 && o.text[0].includes(' ')) { const ws = o.text[0].split(' '); let best = 1, bd = 1e9; for (let i = 1; i < ws.length; i++) { const d = Math.abs(ws.slice(0, i).join(' ').length - o.text[0].length / 2); if (d < bd) { bd = d; best = i; } } lines = [ws.slice(0, best).join(' '), ws.slice(best).join(' ')]; }

/* Efectos: partículas, anillos de toque y textos flotantes */
const fx = {
  p: [],
  burst(x, y, color, n = 10) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), v = rnd(40, 170); this.p.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: rnd(.35, .7), t: 0, color, r: rnd(2, 4.5) }); } },
  text(x, y, s, color = '#fff') { this.p.push({ x, y, vx: 0, vy: -42, life: 1, t: 0, color, s }); },
  ring(x, y, color = '#fff') { this.p.push({ x, y, vx: 0, vy: 0, life: .35, t: 0, color, ring: 1 }); },
  update(dt) { for (const p of this.p) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (!p.s && !p.ring) p.vy += 420 * dt; } this.p = this.p.filter(p => p.t < p.life); },
  draw() {

    }
    ctx.globalAlpha = 1;
  }
};

  elHudBar.style.transform = `scaleX(${clamp(frac, 0, 1).toFixed(3)})`;
  if (elHudScore.textContent !== score) elHudScore.textContent = score;
}
let toastTimer = 0;

function setControls(html) { elControls.innerHTML = html; elControls.hidden = !html; BOT = html ? 92 : 16; }
function holdButton(sel, on) {
  const b = elControls.querySelector(sel); if (!b) return;
  const set = v => e => { if (e) e.preventDefault(); b.classList.toggle('held', v); on(v); };
  b.addEventListener('pointerdown', set(true)); b.addEventListener('pointerup', set(false)); b.addEventListener('pointercancel', set(false)); b.addEventListener('pointerleave', set(false));
  b.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) set(true)(e); });
  b.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') set(false)(e); });
  b.addEventListener('contextmenu', e => e.preventDefault());
}

/* ============================================================
   Etapa 1. Investigación: Tomás examina los brotes con su lupa
   ============================================================ */
function level1() {
  const R = [{ c: 4, sub: 1, time: 22 }, { c: 5, sub: .6, time: 21 }, { c: 5, sub: .4, time: 20 }];
  const TOTAL = 14, MERLOT = [214, 230, 172], CARM = [196, 66, 44];
  const S = { round: 0, left: 0, found: 0, wrong: 0, saved: 0, v: [], wait: 0, roundFound: 0 };
  const w = makeWorker(W * .5, H - 12);
  function setup() {
    const r = R[S.round], ids = shuffle([...Array(12).keys()]).slice(0, r.c);
    S.v = []; for (let i = 0; i < 12; i++) S.v.push({ col: i % 3, row: i / 3 | 0, car: ids.includes(i), found: false, queued: false, shake: 0, ph: rnd(0, 6) });
    S.left = r.time; S.roundFound = 0; toast(`Ronda ${S.round + 1} de 3`);
  }
  function geo(v) { const top = H * .33, cw = (W - 24) / 3, ch = (H - top - 14) / 4; return { x: 12 + cw * (v.col + .62), y: top + ch * (v.row + 1) - 6, cw, ch, cx: 12 + cw * (v.col + .5), s: Math.min(cw / 112, ch / 96) }; }
  const pts = () => Math.max(0, S.found * 100 - S.wrong * 40 + Math.round(S.saved * 5));
  function endRound(msg) { S.wait = 1.4; w.q = []; w.cur = null; w.act = 0; S.v.forEach(v => v.queued = false); toast(msg); }
  function judge(v) {
    const g = geo(v); v.queued = false;
    if (S.wait > 0 || v.found) return;
    if (v.car) {
      v.found = true; S.found++; S.roundFound++; sfx.ok(); fx.burst(g.x, g.y - 60 * g.s, '#e0553a', 12); fx.text(g.x, g.y - 78 * g.s, '+100', GOOD);
      if (S.roundFound >= R[S.round].c) { S.saved += S.left; endRound('Ronda completa'); S.wait = 1; }
    } else { v.shake = .35; S.wrong++; sfx.bad(); fx.text(g.x, g.y - 78 * g.s, 'Es Merlot', BAD); }
  }
  setup();
  return {
    update(dt) {
      for (const v of S.v) v.shake = Math.max(0, v.shake - dt);
      workerUpdate(w, dt, 640, .32);
      if (S.wait > 0) {
        S.wait -= dt;
        if (S.wait <= 0) {
          if (S.round >= R.length - 1) {
            const ratio = clamp((S.found - .5 * S.wrong) / TOTAL, 0, 1) * .85 + .15 * clamp(S.saved / 24, 0, 1);
            return endLevel(ratio, `Tomás identificó ${S.found} de ${TOTAL} parras de Carménère, con ${S.wrong} ${S.wrong === 1 ? 'error' : 'errores'}.`);
          }
          S.round++; setup();
        }
        return;
      }
      S.left -= dt;
      if (S.left <= 0) { S.left = 0; endRound('Se acabó el tiempo de la ronda'); }
      hud(S.left / R[S.round].time, pts() + ' pts');
    },
    draw(t) {
      backdrop(t, 'day', .27, .7, true);
      const tip = mix(MERLOT, CARM, R[S.round].sub), a = acting(w);
      const man = () => farmer(w.x, w.y, geo(S.v[0]).s * 1.02, { face: w.face, moving: w.moving, ph: w.ph, t, tool: 'lupa', hand: a >= 0 ? [18, -78 - Math.sin(a * Math.PI) * 5] : [10, -58] });
      let drawn = false;
      for (const v of S.v) {
        const g = geo(v), dx = v.shake > 0 ? Math.sin(v.shake * 50) * 4 : 0;
        if (!drawn && g.y > w.y) { man(); drawn = true; }
        vine(g.x + dx, g.y, g.s, t, { ph: v.ph, tip: rgb(v.car ? tip : MERLOT), stake: true });
        if (v.queued) { ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.ellipse(g.x, g.y - 44 * g.s, 36 * g.s, 40 * g.s, 0, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
        if (v.found || (S.wait > 0 && v.car)) {
          ctx.strokeStyle = v.found ? '#cf2f4a' : '#ffd774'; ctx.lineWidth = 3; ctx.setLineDash(v.found ? [] : [5, 4]);
          ctx.beginPath(); ctx.ellipse(g.x, g.y - 44 * g.s, 38 * g.s, 42 * g.s, 0, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
          if (v.found) label('Carménère', g.x, g.y - 4, 11, '#fff', '#cf2f4a');
        }
      }
      if (!drawn) man();
      label(`Carménère por encontrar: ${R[S.round].c - S.roundFound}`, W / 2, TOP + 22, 13);

/* ============================================================
   Etapa 7. Crianza en barrica: Tomás cata y reconoce los aromas
   ============================================================ */
function level7() {
  const A = [{ n: 'Mora', c: '#7a2fa8', f: 262 }, { n: 'Ciruela', c: '#c02a6a', f: 311 }, { n: 'Pimienta negra', c: '#5f6877', f: 370 }, { n: 'Pimentón rojo', c: '#e0402f', f: 415 }, { n: 'Chocolate', c: '#8a4a22', f: 494 }, { n: 'Tabaco', c: '#c9a035', f: 554 }];
  const ROUNDS = 6;
  const S = { seq: [], round: 0, mode: 'wait', i: 0, timer: 1, lit: -1, glow: 0, lives: 3, fails: 0, end: false, face: 1 };
  for (let i = 0; i < 3; i++) S.seq.push(Math.floor(Math.random() * 6));
  function geo(i) { const top = TOP + 64, cw = (W - 24) / 2, ch = (H - top - 20) / 3; return { x: 12 + cw * (i % 2 + .5) + (i % 2 ? 1 : -1) * cw * .1, y: top + ch * ((i / 2 | 0) + .44), r: Math.min(cw * .33, ch * .38), ch, top }; }
  function flash(i) { S.lit = i; S.glow = 1; S.face = i % 2 ? 1 : -1; tone(A[i].f, .3, 'triangle', .09); }
  const myRun = runId;
  function finish() { if (S.end || myRun !== runId) return; S.end = true; endLevel(clamp(S.round / ROUNDS - S.fails * .06, 0, 1), `El vino de Tomás completó ${S.round * 2} de 12 meses de crianza, con ${S.fails} ${S.fails === 1 ? 'cata fallida' : 'catas falladas'}.`); }
  return {
    update(dt) {
      if (S.end) return;
      S.glow = Math.max(0, S.glow - dt * 2.4);
      const step = Math.max(.42, .62 - S.round * .03);
      if (S.mode === 'wait') { S.timer -= dt; if (S.timer <= 0) { S.mode = 'show'; S.i = 0; S.timer = 0; } }
      else if (S.mode === 'show') { S.timer -= dt; if (S.timer <= 0) { if (S.i >= S.seq.length) { S.mode = 'input'; S.i = 0; } else { flash(S.seq[S.i]); S.i++; S.timer = step; } } }
      hud(S.round / ROUNDS, `${S.round * 2} meses`);
    },
    draw(t) {
      cellar(t);
      ctx.fillStyle = 'rgba(29,13,24,.84)'; rr(12, TOP + 8, W - 24, 44, 10); ctx.fill();
      txt(S.mode === 'input' ? 'Tu turno: repite la secuencia' : 'Observa la cata de Tomás', 24, TOP + 22, 14, '#f4eadf', 'left');
      txt(`Cata ${Math.min(S.round + 1, ROUNDS)} de ${ROUNDS}  ·  Intentos: ${S.lives}`, 24, TOP + 40, 12, '#c3aab6', 'left', 600);

        label(a.n, g.x, g.y + g.r + 14, 12, '#fff', gl > .1 ? a.c : 'rgba(29,13,24,.8)');

    },
    down(x, y) {
      if (S.mode !== 'input' || S.end) return;

  };

/* ============================================================
   Etapa 8. Embotellado a mano desde la barrica
   ============================================================ */
function level8() {
  const N = 6, LO = .79, HI = .89;

  holdButton('#bFill', v => { const was = S.hold; S.hold = v; if (!v && was && S.phase === 'fill' && S.level >= .5) judge(); });
  const geo = () => { const by = H - BOT - 84, h = clamp(H * .21, 112, 150), cx = W * .6; return { by, h, cx, tip: by - h - 8 }; };
  function judge() {
    const d = S.level < LO ? LO - S.level : S.level > HI ? S.level - HI : 0; const g = geo();
    let q, msg, col; if (d === 0) { q = 1; msg = 'Nivel exacto'; col = GOOD; S.exact++; } else if (d <= .05) { q = .6; msg = S.level < LO ? 'Algo corta' : 'Algo pasada'; col = GOLD; } else { q = .2; msg = S.level < LO ? 'Botella incompleta' : 'Demasiado llena'; col = BAD; }
    S.scores.push(q); q === 1 ? sfx.ok() : sfx.bad(); fx.text(g.cx, g.by - g.h * .5, msg, col); S.phase = 'seal'; S.timer = 0;
  }

    update(dt) {

      else if (S.phase === 'fill') {
        if (S.hold) { S.level += (.36 + .05 * S.n) * dt; if (Math.random() < .3) tone(300 + S.level * 500, .04, 'sine', .02); }
        if (S.level >= .985) { S.level = 1; S.scores.push(0); sfx.bad(); fx.text(g.cx, g.by - g.h * .5, 'Derrame', BAD); fx.burst(g.cx, g.by - g.h, '#7a1630', 14); S.phase = 'seal'; S.timer = 0; }
      }
      else if (S.phase === 'seal') { S.timer += dt; if (S.timer > 1.15) S.phase = 'out'; }
      else if (S.phase === 'out') {
        S.x += 320 * dt;
        if (S.x > W + 60) {
          S.n++;
          if (S.n >= N) { S.end = true; const avg = S.scores.reduce((a, b) => a + b, 0) / N; return endLevel(avg, `Tomás llenó ${S.exact} de ${N} botellas en el nivel exacto.`); }
          S.x = -50; S.level = 0; S.phase = 'in';
        }
      }
      hud(S.n / N, `${Math.min(S.n + 1, N)}/${N}`);
    },
    draw(t) {
      cellar(t); const g = geo(), open = S.hold && S.phase === 'fill';
      // Tomás, detrás del mesón, con la mano en la llave de la barrica
      const fs = (g.h + 66) / 75, fxp = g.cx - 30 - 12 * fs, fyp = g.by + 60;
      farmer(fxp, fyp, fs, { face: 1, t, apron: true, noShadow: true, hand: toLocal(fxp, fyp, fs, 1, g.cx + 2, g.tip - 22 + (open ? 5 : 0)), hand2: [16, -44] });
      // barrica sobre su caballete
      const br = Math.min(46, (g.tip - TOP - 30) * .5), bx = g.cx + br * 1.2, byc = g.tip - br * .55;
      ctx.fillStyle = '#5a3a22'; ctx.fillRect(bx - br * .9, byc + br * .6, 7, g.by - byc - br * .6); ctx.fillRect(bx + br * .8, byc + br * .6, 7, g.by - byc - br * .6); ctx.fillRect(bx - br * 1.1, byc + br * .85, br * 2.2, 7);
      barrelSide(bx, byc, br, 1);
      ctx.strokeStyle = '#c9a84a'; ctx.lineWidth = 5; ctx.lineCap = 'round'; line(bx - br * 1.15, g.tip - 12, g.cx, g.tip - 12); line(g.cx, g.tip - 12, g.cx, g.tip);
      ctx.strokeStyle = '#8a6a22'; ctx.lineWidth = 4; const ha = open ? .9 : 0; line(g.cx + 2, g.tip - 14, g.cx + 2 - Math.sin(ha) * 12, g.tip - 14 - Math.cos(ha) * 12);
      if (open) { ctx.fillStyle = '#7a1630'; ctx.fillRect(g.cx - 2.5, g.tip, 5, g.h * (1 - S.level) + 8); }
      const sealed = S.phase === 'seal' ? S.timer : S.phase === 'out' ? 2 : 0;
      bottle(S.x, g.by, g.h, S.level, { marks: S.phase === 'fill' || S.phase === 'in' ? [LO, HI] : null, cork: clamp(sealed / .35, 0, 1), label: clamp((sealed - .45) / .4, 0, 1) });
      // mesón de madera
      const tg = ctx.createLinearGradient(0, g.by, 0, g.by + 14); tg.addColorStop(0, '#c09058'); tg.addColorStop(1, '#8a5d38');
      ctx.fillStyle = tg; ctx.fillRect(0, g.by, W, 14);
      ctx.fillStyle = '#5f3d24'; ctx.fillRect(0, g.by + 14, W, H - g.by);
      ctx.strokeStyle = 'rgba(30,15,5,.35)'; ctx.lineWidth = 1.5; for (let i = 1; i < 7; i++) line(W * i / 7, g.by + 14, W * i / 7, H);
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, g.by + 14, W, 5);
      // botellas terminadas
      for (let i = 0; i < N; i++) { const mx = W / 2 + (i - (N - 1) / 2) * 30, myb = H - BOT - 10; ctx.globalAlpha = i < S.scores.length && !(i === S.n && S.phase !== 'out') ? 1 : .25; bottle(mx, myb, 46, i < S.scores.length ? .84 : 0, { cork: 1, label: 1 }); }
      ctx.globalAlpha = 1;
    }
  };
}

const MAKERS = [level1, level2, level3, level4, level5, level6, level7, level8];

/* ============================================================
   Flujo de pantallas
   ============================================================ */
const starsHtml = (n, big) => `<span class="stars${big ? ' big' : ''}" role="img" aria-label="${n} de 3 estrellas">${[0, 1, 2].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
function show(html, cls = '') { elScreen.className = cls; elScreen.innerHTML = html; elScreen.hidden = false; elScreen.scrollTop = 0; const f = elScreen.querySelector('[data-focus]'); if (f) f.focus({ preventScroll: true }); }
function stopLevel() { runId++; cur = null; paused = false; elHud.hidden = true; setControls(''); fx.p = []; elToast.classList.remove('on'); }

function showTitle() {
  stopLevel(); ambientMood = 'sunset'; finalView = false;
  const started = totalStars() > 0;
  show(`
    <div class="hero">
      <p class="eyebrow">Chile, 1994</p>
      <h1><span class="strike">Merlot</span><span>Chileno</span></h1>
      <div class="hand">en realidad, Carménère</div>
      <p>Tomás tiene 38 años y una viña familiar que trabaja a mano y sin químicos. Su Merlot esconde una cepa que se creía perdida. Acompáñalo desde la parra hasta la botella.</p>
      <div class="row">
        <button class="btn primary" data-act="map" data-focus type="button">${started ? 'Continuar' : 'Jugar'}</button>
        <button class="btn" data-act="log" type="button">Bitácora</button>
      </div>
      <button class="btn small ghost" data-act="sound" type="button">Sonido: ${save.sound ? 'activado' : 'desactivado'}</button>
    </div>`);
}
function showMap() {
  stopLevel(); ambientMood = 'day'; finalView = false;
  const un = unlocked(); let last = '', list = '';
  LEVELS.forEach((L, i) => {
    if (L.phase !== last) { list += `<li class="phase">${L.phase}</li>`; last = L.phase; }
    const lock = i > un;
    list += `<li><button class="stop${i === un && !save.stars[i] ? ' next' : ''}" data-act="intro:${i}" type="button" ${lock ? 'disabled' : ''}>
      <span class="num">${i + 1}</span><span><span class="t">${L.title}</span><span class="s">${lock ? 'Completa la etapa anterior' : L.tag}</span></span>${starsHtml(save.stars[i])}</button></li>`;
  });
  const done = save.stars.every(s => s > 0);
  show(`
    <div class="panel">
      <div class="topbar"><div><p class="eyebrow">La viña de Tomás</p><h2>De la parra a la botella</h2></div>
      <button class="btn small" data-act="title" type="button">Inicio</button></div>
      <p class="muted small">${totalStars()} de ${N_LEVELS * 3} estrellas. Necesitas al menos una estrella para abrir la etapa siguiente.</p>
      <ul class="route">${list}</ul>
      ${done ? '<button class="btn primary" data-act="final" type="button">Ver mi vino</button>' : ''}
    </div>`, 'full');
}
function showIntro(i) {
  stopLevel(); const L = LEVELS[i];
  const extra = i === 7 ? `
    <label class="field" for="inName">Nombre de la viña de Tomás
      <input id="inName" maxlength="22" autocomplete="off" placeholder="Viña del Carmín" value="${esc(save.name)}"></label>
    <label class="field" for="inValley">Valle de origen
      <select id="inValley">${['Maipo', 'Cachapoal', 'Colchagua', 'Curicó', 'Maule'].map(v => `<option${v === save.valley ? ' selected' : ''}>${v}</option>`).join('')}</select></label>` : '';
  show(`
    <div class="panel">
      <p class="eyebrow">Etapa ${i + 1} de ${N_LEVELS} · ${L.tag}</p>
      <h2>${L.title}</h2>
      <p>${L.story}</p>
      <p class="how"><b>Cómo se juega</b>${L.how}</p>
      ${extra}
      <div class="row">
        <button class="btn primary" data-act="start:${i}" data-focus type="button">Comenzar</button>
        <button class="btn" data-act="map" type="button">Volver a la ruta</button>
      </div>
    </div>`);
}
function startLevel(i) {
  if (i === 7) { const n = $('#inName'), v = $('#inValley'); if (n) save.name = n.value.trim().slice(0, 22); if (v) save.valley = v.value; persist(); }
  stopLevel(); elScreen.hidden = true; elHud.hidden = false; elHudTitle.textContent = `${i + 1}. ${LEVELS[i].title}`;
  hud(1, ''); const sc = MAKERS[i](); cur = { i, scene: sc };
}
function endLevel(ratio, detail) {
  if (!cur) return; const i = cur.i;
  const stars = ratio >= .85 ? 3 : ratio >= .6 ? 2 : ratio >= .35 ? 1 : 0, pts = Math.round(ratio * 1000);
  const record = pts > save.best[i] && save.best[i] > 0;
  save.stars[i] = Math.max(save.stars[i], stars); save.best[i] = Math.max(save.best[i], pts); persist();
  const L = LEVELS[i]; stopLevel(); ambientMood = i < 4 ? 'day' : 'sunset';
  if (stars) sfx.win(); else sfx.bad();
  const last = i === N_LEVELS - 1;
  show(`
    <div class="panel">
      <p class="eyebrow">Etapa ${i + 1} · ${L.title}</p>
      ${starsHtml(stars, true)}
      <h2 style="text-align:center">${['Hay que repetir', 'Etapa superada', 'Buen trabajo', 'Excelente'][stars]}</h2>
      <p>${detail}</p>
      <div class="score-line"><span class="muted">Puntaje${record ? ' (nuevo récord)' : ''}</span><strong>${pts}</strong></div>
      ${stars ? `<p class="fact"><b>Bitácora</b>${L.fact}</p>` : '<p class="muted small">Necesitas al menos una estrella para avanzar a la etapa siguiente.</p>'}
      <div class="row">
        ${stars ? `<button class="btn primary" data-act="${last ? 'final' : 'intro:' + (i + 1)}" data-focus type="button">${last ? 'Ver mi vino' : 'Etapa siguiente'}</button>` : ''}
        <button class="btn${stars ? '' : ' primary'}" data-act="start:${i}" type="button">Repetir</button>
        <button class="btn" data-act="map" type="button">Ruta</button>
      </div>
    </div>`, 'center');
}
function showLog() {
  stopLevel();
  const items = LEVELS.map((L, i) => save.stars[i] > 0
    ? `<p class="fact"><b>${i + 1}. ${L.title}</b>${L.fact}</p>`
    : `<p class="fact locked"><b>${i + 1}. ${L.title}</b>Supera esta etapa para registrar el dato.</p>`).join('');
  show(`
    <div class="panel">
      <div class="topbar"><div><p class="eyebrow">Bitácora de Tomás</p><h2>La historia de una cepa perdida</h2></div>
      <button class="btn small" data-act="title" type="button">Inicio</button></div>
      <div class="log">${items}</div>
    </div>`, 'full');
}
function wineClass() { const s = totalStars(); return s >= 22 ? 'Ícono' : s >= 18 ? 'Gran Reserva' : s >= 13 ? 'Reserva' : 'Varietal'; }
function showFinal() {
  stopLevel(); ambientMood = 'sunset'; finalView = true; sfx.win();
  const s = totalStars();
  show(`
    <div class="panel">
      <p class="eyebrow">El vino de Tomás está listo</p>
      <h2>${esc(save.name || 'Viña del Carmín')}, Carménère ${wineClass()}</h2>
      <p>Tomás y tú reunieron ${s} de ${N_LEVELS * 3} estrellas en la ruta de producción. Lo que por décadas se vendió como Merlot hoy lleva en la etiqueta su nombre verdadero, hecho a mano y sin químicos.</p>
      <p class="muted small">${s >= 22 ? 'Alcanzaste la categoría más alta.' : 'Repite las etapas con menos estrellas para subir la categoría de tu vino: Varietal, Reserva, Gran Reserva e Ícono.'}</p>
      <div class="row">
        <button class="btn primary" data-act="map" data-focus type="button">Volver a la ruta</button>
        <button class="btn" data-act="log" type="button">Bitácora</button>
      </div>
    </div>`);
}
function showPause() {
  if (!cur || paused) return; paused = true;
  show(`
    <div class="panel">
      <p class="eyebrow">Pausa</p>
      <h2>${LEVELS[cur.i].title}</h2>
      <p class="how"><b>Cómo se juega</b>${LEVELS[cur.i].how}</p>
      <div class="row">
        <button class="btn primary" data-act="resume" data-focus type="button">Continuar</button>
        <button class="btn" data-act="start:${cur.i}" type="button">Reiniciar</button>
        <button class="btn" data-act="map" type="button">Salir a la ruta</button>
      </div>
      <button class="btn small ghost" data-act="sound" type="button">Sonido: ${save.sound ? 'activado' : 'desactivado'}</button>
    </div>`, 'center');
}

elScreen.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const [act, arg] = b.dataset.act.split(':'); sfx.tap();
  if (act === 'map') showMap();
  else if (act === 'title') showTitle();
  else if (act === 'log') showLog();
  else if (act === 'final') showFinal();
  else if (act === 'intro') showIntro(+arg);
  else if (act === 'start') startLevel(+arg);
  else if (act === 'resume') { paused = false; elScreen.hidden = true; }
  else if (act === 'sound') { save.sound = !save.sound; persist(); b.textContent = `Sonido: ${save.sound ? 'activado' : 'desactivado'}`; sfx.tap(); }
});
$('#btnPause').addEventListener('click', showPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) showPause(); });

/* ============================================================
   Entrada táctil y bucle principal
   ============================================================ */
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
let pressed = false;
cv.addEventListener('pointerdown', e => { e.preventDefault(); pressed = true; if (cur && !paused && cur.scene && cur.scene.down) { const [x, y] = pos(e); cur.scene.down(x, y); } });
cv.addEventListener('pointermove', e => { if (pressed && cur && !paused && cur.scene && cur.scene.move) { const [x, y] = pos(e); cur.scene.move(x, y); } });
['pointerup', 'pointercancel', 'pointerleave'].forEach(n => cv.addEventListener(n, () => { pressed = false; }));

function resize() {
  const r = app.getBoundingClientRect(); W = Math.max(280, r.width); H = Math.max(420, r.height);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  layers.clear();
}
function drawAmbient(t) {
  // Tomás se ubica en el espacio libre sobre el texto de la portada
  const hero = elScreen.hidden ? null : elScreen.querySelector('.hero');
  const lim = hero ? hero.getBoundingClientRect().top - app.getBoundingClientRect().top : H * .52;
  const y = clamp(lim - 14, 150, H * .52), s = clamp(y / 330, .72, 1.15), hz = Math.round(y - 70 * s), hf = hz / H;
  backdrop(t, ambientMood, hf, 0, true);
  sheep(W * .16, hz + 26 * s, .7 * s, t); sheep(W * .3, hz + 42 * s, .85 * s, t + 1.3, -1);
  vine(W * .86, y + 8, 1.25 * s, t, { stake: true }); bunch(W * .86 + 14 * s, y - 36 * s, 1.1 * s, [72, 24, 86], 1);
  farmer(W * .62, y + 4, 1.12 * s, { face: 1, t, tool: 'lupa', hand: [15, -70 + Math.sin(t * 1.2) * 3] });
  basket(W * .44, y - 6, .5 * s);
}
window.addEventListener('resize', resize);

function drawFinal(t) {
  backdrop(t, 'sunset', .46, 0, true);
  // la botella se encuadra en el espacio libre sobre el panel, con la etiqueta a la vista
  const pn = elScreen.querySelector('.panel'), ar = app.getBoundingClientRect();
  const vis = clamp(pn ? pn.getBoundingClientRect().top - ar.top : H * .5, 180, H * .7);
  const h = vis * 1.2, x = W / 2, yb = vis - 12 + h * .2;
  bottle(x, yb, h, .86, { cork: 1, label: 1, text: [save.name || 'Viña del Carmín', 'D.O. Valle de ' + save.valley, wineClass() + ' · ' + new Date().getFullYear()] });
  farmer(W * .2, vis - 6, clamp(vis / 250, .8, 1.5), { face: 1, t, tool: 'copa', hand: [14, -84 + Math.sin(t * 1.5) * 3] });
  for (let i = 0; i < 3; i++) { const a = t * .8 + i * 2.1; ctx.fillStyle = `rgba(255,220,150,${.35 + .3 * Math.sin(a * 2)})`; ctx.beginPath(); ctx.arc(x + Math.cos(a) * h * .26, yb - h * (.55 + .3 * Math.sin(a * 1.3)), 2.5, 0, TAU); ctx.fill(); }
}

let lastTs = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1;
  if (cur && cur.scene) {
    if (!paused) { clock += dt; cur.scene.update(dt); fx.update(dt); }
    if (cur && cur.scene) { cur.scene.draw(clock); fx.draw(); }
  }
  if (!cur) { clock += dt; if (finalView) drawFinal(clock); else drawAmbient(clock); }
  requestAnimationFrame(frame);
}

function start(data) {
  loadSave(data); resize(); showTitle(); requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => ({ save })); } catch (e) { /* sin actualización en caliente */ } }
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
